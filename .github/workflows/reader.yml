# Publishes the Didakta Reader (the reader/ folder) to GitHub Pages:
# https://farnoosh-shamsian.github.io/didakta/
# One-time setup on GitHub: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Rebuild the folder with `python -I annotation-support/tools/build_reader.py`, then push.
name: Publish the Didakta Reader

on:
  push:
    branches: [main]
    paths: ["reader/**", ".github/workflows/reader.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reader
      - id: deployment
        uses: actions/deploy-pages@v4
