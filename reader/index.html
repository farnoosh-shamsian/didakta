<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Read Greek texts with treebank analysis and Didakta annotations.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta property="og:title" content="Didakta Reader">
<meta property="og:description" content="Read Greek texts with treebank analysis and Didakta annotations.">
<meta property="og:image" content="https://farnoosh-shamsian.github.io/didakta/img/didakta-logo.png">
<meta property="og:url" content="https://farnoosh-shamsian.github.io/didakta/">
</head>
<body>
<title>Didakta Reader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Vazirmatn:wght@400;600&family=Playfair+Display:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
/* Layout: a reading column of Greek on the left, a sticky analysis panel on the right (a bottom sheet on phones). */
:root {
  --bg: #f3f4f1;          /* paper, faintly green-grey */
  --surface: #fbfbf9;
  --ink: #1c222b;
  --muted: #5b6470;
  --rule: #d8dcd5;
  --accent: #1d6a72;      /* annotated words, links */
  --accent-soft: #dcebe8;
  --head: #9a6a1c;        /* the selected word's head */
  --model: #7a4f9a;       /* draft annotations */
  --greek: "Gentium Book Plus", "Gentium Plus", "Noto Serif", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  --rtl: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
  /* the grammar text, as in Didaskalos: English and Portuguese in Cambria with Playfair Display headings,
     Persian and Kurdish in Noto Naskh Arabic */
  --book: "Cambria", Georgia, "Times New Roman", serif;
  --book-head: "Playfair Display", "Cambria", Georgia, serif;
  --book-rtl: "Noto Naskh Arabic", "B Lotus", "Cambria", Georgia, "Times New Roman", serif;
  --book-size: 15.5px;   /* the size of the entries in the word panel, so the book keeps the reader's proportions */
  --side: 420px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181d; --surface: #1a1f25; --ink: #e3e6e8; --muted: #9aa3ad; --rule: #2c333b;
    --accent: #6cc1c6; --accent-soft: #1f3a3c; --head: #e0b25e; --model: #c49be2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181d; --surface: #1a1f25; --ink: #e3e6e8; --muted: #9aa3ad; --rule: #2c333b;
  --accent: #6cc1c6; --accent-soft: #1f3a3c; --head: #e0b25e; --model: #c49be2; color-scheme: dark;
}
[hidden] { display: none !important; }
body { min-height: 100vh; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--ui);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--rule);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
}
.brand { font-weight: 600; letter-spacing: .02em; text-decoration: none; color: var(--ink); white-space: nowrap; }
.brand span { font-family: var(--greek); font-weight: 400; color: var(--accent); }
.nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; min-width: 0; }
.nav .work { font-family: var(--greek); font-size: 17px; }
.nav select, .nav button {
  background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 8px; cursor: pointer;
}
.nav button:disabled { opacity: .4; cursor: default; }
.nav[hidden] { display: none; }
.theme {
  display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; cursor: pointer;
  background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; color: var(--muted);
}
.theme:hover { color: var(--ink); border-color: var(--accent); }
.theme svg { width: 16px; height: 16px; }
.theme .sun { display: none; }
:root[data-theme="dark"] .theme .sun { display: block; }
:root[data-theme="dark"] .theme .moon { display: none; }
#nav[hidden] + .toplink { margin-left: auto; }
.toplink {
  display: inline-flex; align-items: center; height: 30px; box-sizing: border-box; padding: 0 10px; font-size: 14px;
  background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; color: var(--ink); text-decoration: none; white-space: nowrap;
}
.toplink:hover { border-color: var(--accent); }

/* index */
.index {
  max-width: 880px; margin: 0 auto; padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.index h1 { font-family: var(--greek); font-weight: 400; font-size: 34px; margin: 0 0 4px; text-wrap: balance; }
.index .lede { color: var(--muted); margin: 0 0 28px; max-width: 62ch; }
.works { display: grid; gap: 22px; }
.work-row { display: grid; grid-template-columns: 180px 1fr; gap: 6px 20px; padding-top: 18px; border-top: 1px solid var(--rule); }
.work-row h2 { margin: 0; font-family: var(--greek); font-weight: 400; font-size: 24px; line-height: 1.1; }
.work-row .by { color: var(--muted); font-size: 13px; }
.work-row .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 4px; }
.books { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; min-width: 0; }
.book {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  min-width: 40px; height: 34px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 6px;
  text-decoration: none; color: var(--ink); background: var(--surface); font-variant-numeric: tabular-nums; overflow: hidden;
}
.book:hover { border-color: var(--accent); }
.book i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
.work-row.gram { border-top: 2px solid var(--ink); margin-bottom: 10px; }
.work-row.gram .books .book { padding: 0 14px; }
.works-head { margin: 8px 0 -8px; font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.credits { margin-top: 40px; color: var(--muted); font-size: 12.5px; max-width: 70ch; }
.credits p { margin: 4px 0; }

/* reader */
.reader { display: grid; grid-template-columns: minmax(0, 1fr) var(--side); align-items: start; }
.text {
  min-width: 0; padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 24px;
}
.page { max-width: 40em; margin: 0 auto; font-family: var(--greek); font-size: 20px; line-height: 1.75; }
.page h2 { font-family: var(--ui); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 32px 0 8px; }
.page h2:first-child { margin-top: 0; }
.page p { margin: 0 0 14px; }
.line { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); }
.ln { font-family: var(--ui); font-size: 11px; color: var(--muted); text-align: right; padding-right: 1em; padding-top: .55em; font-variant-numeric: tabular-nums; user-select: none; }
.speaker { font-family: var(--ui); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px 3.2em; }
.sec { font-family: var(--ui); font-size: 10.5px; color: var(--muted); vertical-align: super; margin: 0 2px 0 4px; font-variant-numeric: tabular-nums; user-select: none; }
.w { cursor: pointer; border-radius: 3px; }
.w:hover { background: var(--accent-soft); }
.w.a { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.w.sel { background: var(--accent); color: var(--surface); text-decoration-color: var(--surface); }
.w.hd { box-shadow: inset 0 -2px 0 var(--head); }
.loading { font-family: var(--ui); color: var(--muted); }

/* side panel */
.side {
  /* border-box: the padding is inside the height, so the panel ends at the bottom of the window and all of it
     (down to the evidence) can be scrolled into view; dvh follows the visible window on phones and when zoomed */
  box-sizing: border-box;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 54px));
  height: calc(100vh - var(--top-h, 54px) - env(safe-area-inset-top, 0px));
  height: calc(100dvh - var(--top-h, 54px) - env(safe-area-inset-top, 0px));
  overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-left: 1px solid var(--rule);
  padding-block: 22px 40px; padding-left: 22px; padding-right: max(22px, env(safe-area-inset-right, 0px));
}
.side .close { display: none; }
.hint { color: var(--muted); }
.hint b { color: var(--ink); font-weight: 600; }
.form { font-family: var(--greek); font-size: 32px; line-height: 1.1; margin: 0; }
.lemma { font-family: var(--greek); font-size: 18px; color: var(--muted); margin-top: 2px; }
.cite { font-size: 12.5px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.block { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--rule); }
.block h3 { margin: 0 0 10px; font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
code { font-family: var(--mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; }
.headlink { font-family: var(--greek); font-size: 16px; background: none; border: 0; padding: 0; color: var(--head); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.src { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.by { font-size: 12.5px; color: var(--muted); }
.by.model { color: var(--model); }
.conf { font-size: 12px; color: var(--muted); margin-top: 2px; }
.fam { margin-top: 12px; }
.fam-name { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; background: var(--bg); cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chip .p { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.langs { margin-left: auto; display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; text-transform: none; letter-spacing: 0; }
.langs button { border: 0; background: none; padding: 1px 8px; font-size: 12px; cursor: pointer; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
.entry { margin-top: 14px; background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; font-family: var(--book); font-size: 15.5px; line-height: 1.6; }
.entry .etitle { font-family: var(--book-head); font-weight: 700; font-size: 18px; margin: 0 0 2px; }
.entry .ecat { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.entry p { margin: 0 0 8px; }
.entry .ex { font-family: var(--greek); font-size: 15.5px; }
/* each line of an entry is a block with its own direction: Greek lines left-to-right, the rest as the page */
span.l { display: block; }
.entry sup { font-size: 10px; color: var(--muted); }
.entry .notes { margin: 10px 0 0; padding-left: 22px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 8px; }
.entry[dir="rtl"], .entry[dir="rtl"] .etitle { font-family: var(--book-rtl); line-height: 1.9; }
.entry[dir="rtl"] .notes { padding-left: 0; padding-right: 22px; }
.entry .noentry { color: var(--muted); }
.note { margin-top: 12px; font-size: 13.5px; color: var(--muted); }
.reason { margin-top: 14px; }
.reason p { margin: 0; font-size: 14.5px; line-height: 1.6; }
.further { margin-top: 18px; }
.further .reason { margin-top: 0; }
.further .reason + .ev, .further .reason + .note, .further .ev + .note { margin-top: 14px; }
.ev ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.ev li cite.c { margin: 0; }
.fallback { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
cite.c { font-style: normal; font-size: 11.5px; white-space: nowrap; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; margin: 0 1px; }
.none { color: var(--muted); }
.toentry { margin: 10px 0 0; font-family: var(--ui); font-size: 13px; }

/* grammar: contents on one side, the book in a reading column */
.grammar { display: grid; grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
.toc {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 54px)); height: calc(100vh - var(--top-h, 54px) - env(safe-area-inset-top, 0px));
  height: calc(100dvh - var(--top-h, 54px) - env(safe-area-inset-top, 0px));
  box-sizing: border-box; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-inline-end: 1px solid var(--rule);
  padding: 18px 12px 40px; padding-inline-start: max(12px, env(safe-area-inset-left, 0px)); font-size: 13.5px; line-height: 1.35;
}
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc > ol > li { margin-top: 10px; }
.toc a { display: flex; align-items: baseline; gap: 6px; padding: 3px 8px; border-radius: 5px; text-decoration: none; color: var(--muted); }
.toc a.tp { color: var(--ink); font-weight: 600; }
.toc a:hover { background: var(--accent-soft); color: var(--ink); }
.toc a.current { background: var(--accent-soft); color: var(--accent); }
.toc .tg { flex: none; font-family: var(--mono); font-size: 11px; color: var(--accent); }
.toc [hidden] { display: none; }
.gmain { min-width: 0; padding: 0 28px 96px; padding-inline-end: max(28px, env(safe-area-inset-right, 0px)); }
.gbar {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 54px)); z-index: 4; background: var(--bg);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; max-width: 46em; margin: 0 auto; padding: 12px 0; border-bottom: 1px solid var(--rule);
  font-family: var(--ui); font-size: 14px;
}
.gbar input {
  flex: 1 1 220px; min-width: 0; font: inherit; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--surface); color: var(--ink);
}
.gbar .langs { margin: 0; }
.gbar .langs button { padding: 4px 10px; font-size: 13px; }
.gcount { color: var(--muted); font-size: 13px; white-space: nowrap; }
.gcount:empty { display: none; }
.tocbtn { display: none; }
.gbook { max-width: 46em; margin: 0 auto; padding-top: 28px; font-family: var(--book); font-size: var(--book-size); line-height: 1.6; }
.gbook[dir="rtl"] { font-family: var(--book-rtl); line-height: 1.9; }
.gbook h1 { font-family: var(--book-head); font-weight: 700; font-size: 1.9em; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
.gbook .gmeta { font-family: var(--ui); font-size: 13px; color: var(--muted); margin: 0 0 18px; }
.gbook .subtitle { font-size: 1.1em; color: var(--muted); margin: 0 0 18px; }
.gbook[dir="rtl"] h1, .gbook[dir="rtl"] h2, .gbook[dir="rtl"] h3 { font-family: var(--book-rtl); line-height: 1.6; }
.gbook p { margin: 0 0 10px; }
.gbook ul { padding-inline-start: 1.2em; }
.gbook li { margin-bottom: 6px; }
.gpart > h2 { font-family: var(--book-head); font-weight: 700; font-size: 1.5em; line-height: 1.25; margin: 48px 0 10px; padding-top: 14px; border-top: 2px solid var(--ink); }
.gentry { margin-top: 30px; }
.gentry h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; font-family: var(--book-head); font-weight: 700; font-size: 1.2em; line-height: 1.3; margin: 0 0 8px; }
.gentry h3 .tg { font-family: var(--mono); font-weight: 400; font-size: 13px; color: var(--accent); }
.gentry h3 .tg a { color: inherit; text-decoration: none; }
.gentry h3 .tg a:hover { text-decoration: underline; }
.gbook .ex { font-family: var(--greek); font-size: 1em; }
.gbook .ex .l { padding-inline-start: 1em; }
.gbook[dir="rtl"] .ex { font-family: "Gentium Book Plus", "Gentium Plus", "Noto Naskh Arabic", "Noto Serif", serif; }
.gbook sup { font-size: 0.6em; color: var(--muted); }
.gbook .notes { margin: 10px 0 0; padding: 6px 0 0; padding-inline-start: 22px; font-family: var(--ui); font-size: 12px; color: var(--muted); border-top: 1px solid var(--rule); }
.gbook .notes li { margin: 0; }
.gk { color: inherit; text-decoration: none; }
.gk:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.gbook [id^="g-"] { scroll-margin-top: calc(var(--top-h, 54px) + var(--bar-h, 60px) + 14px); }
.gbook [hidden] { display: none; }
.gnone { color: var(--muted); font-family: var(--ui); }
mark { background: #f2d675; color: inherit; border-radius: 2px; padding: 0 1px; }
:root[data-theme="dark"] mark { background: #6e5a17; }

@media (max-width: 900px) {
  :root { --side: 360px; }
  .work-row { grid-template-columns: 1fr; }
  .grammar { grid-template-columns: 240px minmax(0, 1fr); }
  .gmain { padding-inline: 20px; }
}
@media (max-width: 720px) {
  .reader { grid-template-columns: minmax(0, 1fr); }
  .text { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .page { font-size: 19px; }
  .side {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: auto; max-height: 62vh; z-index: 8;
    border-left: 0; border-top: 1px solid var(--rule); box-shadow: 0 -8px 24px rgba(0,0,0,.12);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .side.empty { display: none; }
  .grammar { grid-template-columns: minmax(0, 1fr); }
  .gmain { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .toc {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: auto; max-height: 70vh; z-index: 8;
    border-inline-end: 0; border-top: 1px solid var(--rule); box-shadow: 0 -8px 24px rgba(0,0,0,.12);
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .grammar.toc-open .toc { display: block; }
  .tocbtn { display: inline-flex; }
  .side .close { display: inline-block; float: right; border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
}
@media (prefers-reduced-motion: no-preference) {
  .w { transition: background-color .12s; }
}
</style>

<script>
(() => {
  let t = null;
  try { t = localStorage.getItem("didakta-theme"); } catch {}
  if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
})();
</script>
<header class="top" id="top">
  <a class="brand" href="#">Didakta <span>Reader</span></a>
  <nav class="nav" id="nav" hidden>
    <span class="work" id="nav-work"></span>
    <button id="prev" type="button" aria-label="Previous book">‹</button>
    <select id="book" aria-label="Book"></select>
    <button id="next" type="button" aria-label="Next book">›</button>
  </nav>
  <a class="toplink" id="toplink" href="#grammar">Grammar</a>
  <button class="theme" id="theme" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main id="index" class="index" hidden></main>

<div id="reader" class="reader" hidden>
  <section class="text"><div class="page" id="page" tabindex="0" aria-label="Greek text"></div></section>
  <aside class="side empty" id="side" aria-live="polite"></aside>
</div>

<div id="grammar" class="grammar" hidden>
  <nav class="toc" id="toc" aria-label="Contents of the grammar"></nav>
  <section class="gmain">
    <div class="gbar" id="gbar">
      <input type="search" id="gq" placeholder="Search the grammar: a word, a Greek form, a tag…" aria-label="Search the grammar" dir="auto" autocomplete="off" spellcheck="false">
      <span class="gcount" id="gcount" aria-live="polite"></span>
      <span class="langs" role="group" aria-label="Language of the grammar" id="glangs"></span>
      <button class="toplink tocbtn" id="tocbtn" type="button" aria-controls="toc" aria-expanded="false">Contents</button>
    </div>
    <article class="gbook" id="gbook"></article>
  </section>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  let INDEX = null, ENTRIES = null, BOOK = null, WORK = null, SEL = -1, LANG = store.get("didakta-lang") || "en";

  // ---------- light / dark
  const themeBtn = $("#theme");
  const sysDark = matchMedia("(prefers-color-scheme: dark)");
  const setTheme = (t) => {
    document.documentElement.dataset.theme = t;
    const label = t === "dark" ? "Switch to light mode" : "Switch to dark mode";
    themeBtn.setAttribute("aria-label", label); themeBtn.title = label;
  };
  setTheme(document.documentElement.dataset.theme || (sysDark.matches ? "dark" : "light"));
  themeBtn.addEventListener("click", () => {
    const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    setTheme(t); store.set("didakta-theme", t);
  });
  // Until the reader picks one, follow the system setting as it changes.
  sysDark.addEventListener("change", (e) => { if (!store.get("didakta-theme")) setTheme(e.matches ? "dark" : "light"); });
  const cache = new Map();
  const getJSON = (p) => fetch(p).then((r) => { if (!r.ok) throw new Error(p + ": " + r.status); return r.json(); });

  // ---------- treebank labels
  const POS = { n: "noun", v: "verb", a: "adjective", d: "adverb", l: "article", g: "particle", c: "conjunction", r: "preposition", p: "pronoun", m: "numeral", i: "interjection", e: "exclamation", u: "punctuation", x: "irregular" };
  const SLOTS = [
    null,
    { 1: "1st person", 2: "2nd person", 3: "3rd person" },
    { s: "singular", p: "plural", d: "dual" },
    { p: "present", i: "imperfect", r: "perfect", l: "pluperfect", t: "future perfect", f: "future", a: "aorist" },
    { i: "indicative", s: "subjunctive", o: "optative", n: "infinitive", m: "imperative", p: "participle" },
    { a: "active", p: "passive", m: "middle", e: "middle or passive" },
    { m: "masculine", f: "feminine", n: "neuter", c: "common" },
    { n: "nominative", g: "genitive", d: "dative", a: "accusative", v: "vocative", l: "locative" },
    { c: "comparative", s: "superlative" },
  ];
  const REL = {
    PRED: "predicate", SBJ: "subject", OBJ: "object", ATR: "attribute", ADV: "adverbial", ATV: "complement", AtvV: "complement",
    PNOM: "predicate nominal", OCOMP: "object complement", COORD: "coordinator", APOS: "apposition", AuxP: "preposition",
    AuxC: "conjunction", AuxR: "reflexive", AuxV: "auxiliary verb", AuxX: "comma", AuxG: "bracket", AuxK: "final punctuation",
    AuxY: "sentence particle", AuxZ: "emphasizing particle", ExD: "governed by an elided word", MWE: "multi-word expression",
  };
  const FAMS = ["CASE", "TENSE", "VOICE", "MOOD", "INF", "PART", "ART", "AUT"];
  const FAMNAME = { CASE: "Case", TENSE: "Tense", VOICE: "Voice", MOOD: "Mood", INF: "Infinitive", PART: "Participle", ART: "Article", AUT: "αὐτός" };

  function morph(tag) {
    if (!tag) return "";
    const out = [POS[tag[0]] || ""];
    for (let k = 1; k < 9; k++) { const v = SLOTS[k] && SLOTS[k][tag[k]]; if (v) out.push(v); }
    return out.filter(Boolean).join(" · ");
  }
  function relation(rel) {
    if (!rel) return "";
    const [base, ...rest] = rel.split("_");
    let s = REL[base] || base;
    if (rest.includes("CO")) s += ", coordinated";
    if (rest.includes("AP")) s += ", in apposition";
    if (rest.includes("ExD")) s += ", with an elided word";
    return s;
  }
  const isPunct = (t) => t[2].startsWith("u") || /^[,.·;:!?·;’ʼ”“"'()\[\]—–-]+$/.test(t[0]);

  // ---------- routing
  // Where each view was scrolled to, so that Back returns to the same place.
  const SCROLL = {};
  let VIEW = null;
  function route() {
    if (VIEW) SCROLL[VIEW] = window.scrollY;
    const h = decodeURIComponent(location.hash.slice(1));
    const m = h.match(/^([a-z]+)-(\d+)$/);
    const g = h.match(/^grammar(?:\/([a-z]{2}))?(?:\/([\w-]+))?$/);
    if (g) openGrammar(g[1], g[2]);
    else if (INDEX && m && INDEX.works.some((w) => w.id === m[1])) openBook(m[1], +m[2]);
    else showIndex();
  }
  function setView(v) {
    VIEW = v;
    const inGrammar = v === "grammar";
    $("#grammar").hidden = !inGrammar;
    if (!inGrammar) $("#grammar").classList.remove("toc-open");
    const tl = $("#toplink");
    tl.textContent = inGrammar ? "Texts" : "Grammar";
    tl.href = inGrammar ? "#" : "#grammar";
  }

  function showIndex() {
    $("#reader").hidden = true; $("#nav").hidden = true; $("#index").hidden = false;
    setView("index");
    document.title = "Didakta Reader";
    const fmt = (n) => n.toLocaleString("en");
    const rows = INDEX.works.map((w) => {
      const words = w.books.reduce((a, b) => a + b.words, 0), ann = w.books.reduce((a, b) => a + b.annotated, 0);
      const label = w.books.length === 1 ? "" : "Book ";
      const books = w.books.map((b) => {
        const pct = b.words ? Math.min(100, (100 * b.annotated) / b.words) : 0;
        return `<a class="book" href="#${w.id}-${b.n}" title="${label}${b.n}: ${fmt(b.annotated)} of ${fmt(b.words)} words tagged">${w.books.length === 1 ? "Read" : b.n}${pct ? `<i style="width:${pct.toFixed(1)}%"></i>` : ""}</a>`;
      }).join("");
      return `<div class="work-row"><div><h2>${esc(w.title)}</h2><div class="by">${esc(w.author)}</div>
        <div class="count">${fmt(words)} words · ${ann ? fmt(ann) + " tagged" : "no Didakta tags yet"}</div></div>
        <div class="books">${books}</div></div>`;
    }).join("");
    const src = Object.values(INDEX.sources).map((s) => `<li>${esc(s)}</li>`).join("");
    const gram = GLANGS.map((l) => `<a class="book" href="#grammar/${l}" lang="${LANGCODE[l]}">${esc(LANGSELF[l])}</a>`).join("");
    $("#index").innerHTML = `<h1>Didakta Reader</h1>
      <p class="lede">Read the Greek text and click any word to see its treebank analysis and its Didakta annotation, with the full Didakta entry. Underlined words have Didakta tags; the bar under each book shows how much of it is tagged. The Didakta grammar itself can be read from start to finish, and searched, in each of its languages.</p>
      <div class="works">
        <div class="work-row gram"><div><h2><a href="#grammar" style="color:inherit;text-decoration:none">Didakta Grammar</a></h2><div class="by">The grammar for annotation, as a book</div>
          <div class="count">${GLANGS.length} languages · searchable</div></div>
          <div class="books">${gram}</div></div>
        <div class="works-head">Texts</div>
        ${rows}</div>
      <div class="credits"><p>Treebanks:</p><ul>${src}</ul>
      <p>Didakta tags and entries: the Didakta project. Greek texts follow the treebanks.</p></div>`;
    window.scrollTo(0, SCROLL.index || 0);
  }

  async function openBook(work, n) {
    const w = INDEX.works.find((x) => x.id === work);
    const b = w.books.find((x) => x.n === n) || w.books[0];
    $("#index").hidden = true; $("#reader").hidden = false; $("#nav").hidden = false;
    setView(`${work}-${b.n}`);
    $("#nav-work").textContent = w.title;
    $("#book").innerHTML = w.books.map((x) => `<option value="${x.n}"${x.n === b.n ? " selected" : ""}>${w.books.length === 1 ? "Whole text" : "Book " + x.n}</option>`).join("");
    const i = w.books.indexOf(b);
    $("#prev").disabled = i <= 0; $("#next").disabled = i >= w.books.length - 1;
    document.title = `${w.title} ${w.books.length > 1 ? b.n : ""} · Didakta Reader`;
    measureTop();
    if (BOOK && BOOK.work === work && BOOK.book === b.n) { window.scrollTo(0, SCROLL[VIEW] || 0); return; }
    $("#page").innerHTML = '<p class="loading">Loading the text…</p>';
    const key = `${work}-${b.n}`;
    let data = cache.get(key);
    try {
      if (!data) { data = await getJSON(`data/${key}.json`); cache.set(key, data); }
    } catch (e) {
      $("#page").innerHTML = `<p class="loading">This book could not be loaded (${esc(e.message)}). Reload the page to try again.</p>`;
      return;
    }
    WORK = w; BOOK = data; SEL = -1;
    render();
    showEmpty();
    window.scrollTo(0, 0);
  }

  // ---------- text
  function render() {
    const t = BOOK.t, ann = BOOK.ann, verse = WORK.kind === "verse";
    const refAt = new Map(BOOK.refs.map(([k, r]) => [k, r]));
    const spAt = new Map((BOOK.sp || []).map(([k, s]) => [k, s]));
    const out = [];
    let buf = [], label = "", lastChapter = null;
    const word = (k) => {
      const tok = t[k];
      if (isPunct(tok)) return esc(tok[0]);
      return ` <span class="w${ann[k] ? " a" : ""}" data-i="${k}">${esc(tok[0])}</span>`;
    };
    // verse: one row per line; prose: one paragraph per chapter, with section numbers
    const flush = () => {
      if (!buf.length) return;
      if (verse) {
        const n = label.includes(".") ? label.split(".").pop() : label;
        const show = n && (+n === 1 || +n % 5 === 0);
        out.push(`<div class="line"><span class="ln">${show ? esc(n) : ""}</span><span>${buf.join("")}</span></div>`);
      } else {
        out.push(`<p>${buf.join("")}</p>`);
      }
      buf = [];
    };
    for (let k = 0; k < t.length; k++) {
      if (t[k][5]) continue;                       // artificial node: not in the text
      if (spAt.has(k)) { flush(); out.push(`<div class="speaker">${esc(spAt.get(k))}</div>`); }
      if (refAt.has(k)) {
        const ref = refAt.get(k);
        if (verse) { flush(); label = ref; }
        else {
          const parts = ref.split(".");
          const chapter = parts.slice(0, 2).join(".");
          if (chapter !== lastChapter) { flush(); out.push(`<h2>Chapter ${esc(parts[1] || "")}</h2>`); lastChapter = chapter; }
          buf.push(` <span class="sec">${esc(parts[2] || ref)}</span>`);
        }
      }
      buf.push(word(k));
    }
    flush();
    $("#page").innerHTML = out.join("");
  }

  // ---------- side panel
  function refOf(k) {
    let r = "";
    for (const [i, ref] of BOOK.refs) { if (i > k) break; r = ref; }
    return r;
  }
  function srcOf(k) {
    let s = "";
    for (const [i, code] of BOOK.src) { if (i > k) break; s = code; }
    return s;
  }
  function showEmpty() {
    const side = $("#side");
    side.classList.add("empty");
    const n = Object.keys(BOOK.ann).length;
    side.innerHTML = `<p class="hint">Click a word to see its treebank analysis and its Didakta annotation.</p>
      <p class="hint">${n ? `<b>${n.toLocaleString("en")}</b> words in this ${WORK.books.length > 1 ? "book" : "text"} have Didakta tags; they are underlined.` : "No word in this book has Didakta tags yet."}</p>`;
    document.querySelectorAll(".w.sel, .w.hd").forEach((e) => e.classList.remove("sel", "hd"));
  }

  const LANGNAME = { en: "English", fa: "Persian", ku: "Kurdish", pt: "Portuguese" };
  const LANGCODE = { en: "en", fa: "fa", ku: "ckb", pt: "pt" };
  const LANGSELF = { en: "English", fa: "فارسی", ku: "کوردی", pt: "Português" };
  const GLANGS = ["en", "fa", "ku", "pt"];

  // "claude-opus-5-5" -> "Claude Opus 5.5"
  function modelName(who) {
    const m = /^claude-([a-z]+)-(\d+)-(\d+)$/.exec(who || "");
    return m ? `Claude ${m[1][0].toUpperCase()}${m[1].slice(1)} ${m[2]}.${m[3]}` : who || "Claude";
  }

  function entryHTML(tag) {
    const e = ENTRIES && ENTRIES[tag];
    if (!e) return `<div class="entry"><p class="noentry">${esc(tag)}: no Didakta entry for this tag.</p></div>`;
    const use = e[LANG] ? LANG : "en", v = e[use];
    const rtl = use === "fa" || use === "ku";
    const fb = use !== LANG ? `<p class="fallback" dir="ltr">No ${LANGNAME[LANG] || LANG} version of this entry yet; showing English.</p>` : "";
    return `<div class="entry" dir="${rtl ? "rtl" : "ltr"}" lang="${LANGCODE[use] || use}">${fb}
      <p class="etitle"><bdi>§${esc(tag)}.</bdi> ${v.title}</p>${v.category ? `<div class="ecat">${esc(v.category)}</div>` : ""}${v.html}
      <p class="toentry" dir="ltr"><a href="#grammar/${use}/${esc(tag)}">Read §${esc(tag)} in the grammar →</a></p></div>`;
  }

  function select(k, scroll) {
    if (k < 0 || !BOOK || !BOOK.t[k]) return;
    SEL = k;
    const tok = BOOK.t[k], a = BOOK.ann[k], head = tok[4] >= 0 ? BOOK.t[tok[4]] : null;
    document.querySelectorAll(".w.sel, .w.hd").forEach((e) => e.classList.remove("sel", "hd"));
    const el = document.querySelector(`.w[data-i="${k}"]`);
    if (el) { el.classList.add("sel"); if (scroll) el.scrollIntoView({ block: "center", behavior: "smooth" }); }
    if (head) { const h = document.querySelector(`.w[data-i="${tok[4]}"]`); if (h) h.classList.add("hd"); }

    const ref = refOf(k);
    const cite = `${WORK.title} ${WORK.kind === "verse" && WORK.books.length > 1 ? ref : WORK.kind === "verse" ? "line " + ref : ref}`;
    let html = `<button class="close" type="button" id="close">Close</button>
      <p class="form">${esc(tok[0])}</p>${tok[1] ? `<div class="lemma">${esc(tok[1])}</div>` : ""}<div class="cite">${esc(cite)}</div>`;

    html += `<div class="block"><h3>Treebank</h3><dl class="kv">
      <dt>Word class</dt><dd>${esc(morph(tok[2])) || "—"}</dd>
      <dt>Postag</dt><dd><code>${esc(tok[2] || "—")}</code></dd>
      <dt>Relation</dt><dd>${esc(relation(tok[3])) || "—"} <code>${esc(tok[3])}</code></dd>
      <dt>Head</dt><dd>${head ? `<button class="headlink" type="button" data-go="${tok[4]}">${esc(head[0])}</button>` : "none (sentence root)"}</dd>
      </dl><div class="src">${esc(INDEX.sources[srcOf(k)] || "")}</div></div>`;

    html += `<div class="block"><h3>Didakta<span class="langs" role="group" aria-label="Entry language">
      <button type="button" data-lang="en" aria-pressed="${LANG === "en"}">EN</button>
      <button type="button" data-lang="fa" aria-pressed="${LANG === "fa"}" lang="fa">فارسی</button>
      <button type="button" data-lang="ku" aria-pressed="${LANG === "ku"}" lang="ckb">کوردی</button>
      <button type="button" data-lang="pt" aria-pressed="${LANG === "pt"}" lang="pt">PT</button></span></h3>`;
    if (!a) {
      html += `<p class="none">No Didakta annotation for this word yet.</p></div>`;
    } else {
      const by = a.by === "model" ? `Drafted by ${modelName(a.who)}` : INDEX.by[a.by] || "";
      html += `<div class="by ${a.by === "model" ? "model" : ""}">${esc(by)}</div>`;
      if (Object.values(a.f).some((tags) => tags.some(([, p]) => p != null)))
        html += `<div class="conf">Percentages show Claude's confidence: its best guess first, followed by alternatives.</div>`;
      let first = null;
      for (const fam of FAMS) {
        const tags = a.f[fam];
        if (!tags) continue;
        html += `<div class="fam"><div class="fam-name">${FAMNAME[fam]}</div><div class="chips">` + tags.map(([tag, p], j) => {
          if (!first) first = tag;
          return `<button class="chip" type="button" data-tag="${esc(tag)}" aria-pressed="false">${esc(tag)}${p != null ? `<span class="p">${Math.round(p * 100)}%</span>` : j ? `<span class="p">alternative</span>` : ""}</button>`;
        }).join("") + "</div></div>";
      }
      const [why, more] = splitReason(a.r || "");
      if (why) html += `<div class="reason"><div class="fam-name">Why</div><p>${reasonHTML(why)}</p></div>`;
      html += `<div id="entry"></div>`;
      const ev = (a.ev || "").split(";").map((s) => s.trim()).filter(Boolean);
      if (more || ev.length || a.n) {
        html += `<div class="further">`;
        if (more) html += `<div class="reason"><div class="fam-name">More reasoning</div><p>${reasonHTML(more)}</p></div>`;
        if (ev.length) html += `<div class="ev"><div class="fam-name">Evidence</div><ul>${ev.map((c) => `<li><cite class="c" title="${esc(c)}">${esc(citeLabel(c))}</cite></li>`).join("")}</ul></div>`;
        if (a.n) html += `<div class="note"><div class="fam-name">Annotator's note</div>${reasonHTML(a.n)}</div>`;
        html += `</div>`;
      }
      html += `</div>`;
      setTimeout(() => showEntry(first), 0);
    }
    const side = $("#side");
    side.classList.remove("empty");
    side.innerHTML = html;
    side.scrollTop = 0;
  }

  // ---------- citations in the annotator's reasoning: [SMYTH:1476], [COMM:<source>:<pdf page>], [CONV:D3], ...
  function citeLabel(code) {
    const [kind, a, b] = code.split(":");
    switch (kind) {
      case "COMM": return `${(INDEX.commentaries || {})[a] || a}${b ? ", PDF p. " + b : ""}`;
      case "SMYTH": return `Smyth §${a}`;
      case "GMT": return `Goodwin, Moods and Tenses §${a}`;
      case "GILD": return `Gildersleeve §${a}`;
      case "CONV": return a && a[0] === "R" ? `project rule ${a}` : `project decision ${a}`;
      case "PREP": return `with ${a}`;
      case "SEED": return "Didakta's own example";
      case "TREE": return "treebank";
      case "TR": return "translation";
      case "LSJ": return "LSJ";
      case "CTX": return "context";
      case "MORPH": return "morphology";
      case "BRK": return "editor's brackets";
      default: return code;
    }
  }
  // First sentence (with any citations attached to it) vs. the rest. Skips abbreviations like "cf." and "p.".
  function splitReason(text) {
    const re = /[.!?]["”’)]?(?=\s+)/g;
    let m;
    while ((m = re.exec(text))) {
      const end = m.index + m[0].length;
      const before = text.slice(0, m.index), after = text.slice(end).trimStart();
      if (/(?:^|[\s(])(?:cf|e\.g|i\.e|p|pp|l|ll|vs|viz|sc|ch|al|ff|ed|Il|Od|Anab|Cyr|Thuc|Thukyd|Hdt)$/i.test(before)) continue;
      if (!after || /^[0-9a-z]/.test(after)) continue;
      return [text.slice(0, end).trim(), after];
    }
    return [text.trim(), ""];
  }
  function reasonHTML(text) {
    return esc(text).replace(/\[([A-Z]{2,5}(?::[^\]\s]+)?)\]/g, (_, code) => `<cite class="c" title="${esc(code)}">${esc(citeLabel(code))}</cite>`);
  }

  let ENTRY_TAG = null;
  async function showEntry(tag) {
    if (!tag) return;
    ENTRY_TAG = tag;
    document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.tag === tag)));
    const box = $("#entry");
    if (!box) return;
    if (!ENTRIES) {
      box.innerHTML = '<p class="loading">Loading the entry…</p>';
      try { ENTRIES = await getJSON("data/entries.json"); }
      catch (e) { box.innerHTML = `<p class="none">The Didakta entries could not be loaded (${esc(e.message)}).</p>`; return; }
    }
    if (ENTRY_TAG === tag && $("#entry")) $("#entry").innerHTML = entryHTML(tag);
  }

  // ---------- the grammar as a book: every entry in its language's order, with contents and search
  let GRAMMAR = null, GLANG = null, GIDX = [], GPARTS = [], GINTRO = null, GCUR = null, SPY = null;
  const GMETA = {
    en: { file: "english", cite: "Farnoosh Shamsian & H. W. Smyth (2023)", doi: "10.5281/zenodo.11216456" },
    fa: { file: "persian", cite: "Farnoosh Shamsian & H. W. Smyth (2024)", doi: "10.5281/zenodo.11216819" },
    ku: { file: "kurdish", cite: "Translated by Farshid Rahimi (2024)", doi: "10.5281/zenodo.11221442" },
    pt: { file: "portuguese", cite: "Translated by Anise D'Orange Ferreira (2024)", url: "https://github.com/ProjetosAbertosClassicasDigitais/Didakta-br-portuguese/" },
  };
  const FILES = "https://github.com/farnoosh-shamsian/didakta/raw/main/grammar/";
  // Search ignores accents, breathings, case, final sigma, and the Arabic/Persian letter variants.
  const fold = (s) => s.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase()
    .replace(/ς/g, "σ").replace(/[يى]/g, "ی").replace(/ك/g, "ک").replace(/[‌‍ـ]/g, "");
  const noSup = (h) => h.replace(/<sup>.*?<\/sup>/g, "").trim();
  const rtlLang = (l) => l === "fa" || l === "ku";

  async function openGrammar(lang, target) {
    const wasHere = VIEW === "grammar";
    $("#index").hidden = true; $("#reader").hidden = true; $("#nav").hidden = true;
    setView("grammar");
    measureTop();
    if (!GRAMMAR) {
      $("#gbook").innerHTML = '<p class="loading">Loading the grammar…</p>';
      try {
        const [g, e] = await Promise.all([getJSON("data/grammar.json"), ENTRIES || getJSON("data/entries.json")]);
        GRAMMAR = g; ENTRIES = e;
      } catch (err) {
        $("#gbook").innerHTML = `<p class="loading">The grammar could not be loaded (${esc(err.message)}). Reload the page to try again.</p>`;
        return;
      }
      if (VIEW !== "grammar") return;   // the reader went elsewhere while it loaded
    }
    if (!GRAMMAR[lang]) lang = GRAMMAR[LANG] ? LANG : "en";
    if (LANG !== lang) { LANG = lang; store.set("didakta-lang", LANG); }
    const changed = lang !== GLANG;
    if (changed) { GLANG = lang; renderGrammar(); }
    document.title = `${GRAMMAR[lang].title} · Didakta Reader`;
    measureBar();
    if (target) goTo(target);
    else if (changed) window.scrollTo(0, 0);
    else if (!wasHere) window.scrollTo(0, SCROLL.grammar || 0);
  }

  function renderGrammar() {
    const b = GRAMMAR[GLANG], base = `#grammar/${GLANG}/`, meta = GMETA[GLANG] || {};
    const g = $("#grammar"), book = $("#gbook"), toc = $("#toc");
    g.dir = rtlLang(GLANG) ? "rtl" : "ltr"; g.lang = LANGCODE[GLANG];
    book.dir = g.dir; book.lang = g.lang;   // the book's own fonts key on these
    const files = meta.file ? [["pdf", "PDF"], ["epub", "EPUB"], ["docx", "Word"], ["xml", "TEI XML"]]
      .map(([x, name]) => `<a href="${FILES}${meta.file}/didakta-${meta.file}.${x}">${name}</a>`).join(" · ") : "";
    const src = meta.doi ? ` · <a href="https://doi.org/${meta.doi}">doi:${meta.doi}</a>` : meta.url ? ` · <a href="${meta.url}">source</a>` : "";
    let h = `<header id="g-top"><h1>${esc(b.title)}</h1>
      <p class="gmeta" dir="ltr">${esc(meta.cite || "")}${src}${files ? ` · Also as ${files}` : ""}</p>
      ${b.intro ? `<div class="gintro">${b.intro}</div>` : ""}</header>`;
    let t = "<ol>" + (b.intro ? `<li data-intro><a class="tp" href="${base}top" data-go="top">Introduction</a></li>` : "");
    b.parts.forEach((p, i) => {
      const pid = `part-${i + 1}`;
      h += `<section class="gpart" id="g-${pid}"><h2>${p.title}</h2>${p.html ? `<div class="gpbody">${p.html}</div>` : ""}`;
      t += `<li data-part="${pid}"><a class="tp" href="${base}${pid}" data-go="${pid}">${noSup(p.title)}</a>`;
      const items = [];
      for (const tag of p.tags) {
        const e = ENTRIES[tag] && ENTRIES[tag][GLANG];
        if (!e) continue;
        h += `<article class="gentry" id="g-${tag}" data-tag="${tag}"><h3><span class="tg"><a href="${base}${tag}" title="Link to this entry" dir="ltr">§${tag}</a></span><span>${e.title}</span></h3>${e.html}</article>`;
        items.push(`<li data-tag="${tag}"><a href="${base}${tag}" data-go="${tag}"><span class="tg">${tag}</span><span>${noSup(e.title)}</span></a></li>`);
      }
      t += (items.length ? `<ol>${items.join("")}</ol>` : "") + "</li>";
      h += "</section>";
    });
    book.innerHTML = h + '<p class="gnone" id="gnone" hidden>No entry matches this search.</p>';
    toc.innerHTML = t + "</ol>";
    linkGreek(book);

    GIDX = [...book.querySelectorAll(".gentry")].map((el) => ({
      el, text: fold(el.dataset.tag + " " + el.textContent), toc: toc.querySelector(`li[data-tag="${el.dataset.tag}"]`) }));
    GPARTS = [...book.querySelectorAll(".gpart")].map((el) => {
      const body = el.querySelector(".gpbody"), h2 = el.querySelector("h2");
      return { el, h2, body, text: fold(h2.textContent + " " + (body ? body.textContent : "")),
               toc: toc.querySelector(`li[data-part="${el.id.slice(2)}"]`), entries: GIDX.filter((r) => el.contains(r.el)) };
    });
    const intro = book.querySelector(".gintro");
    GINTRO = intro ? { el: intro, text: fold(intro.textContent), toc: toc.querySelector("li[data-intro]") } : null;

    $("#glangs").innerHTML = GLANGS.filter((l) => GRAMMAR[l]).map((l) =>
      `<button type="button" data-glang="${l}" aria-pressed="${l === GLANG}" lang="${LANGCODE[l]}" title="${LANGNAME[l]}">${l === "en" ? "EN" : l === "pt" ? "PT" : LANGSELF[l]}</button>`).join("");

    if (SPY) SPY.disconnect();
    GCUR = null;
    SPY = new IntersectionObserver((es) => {
      for (const e of es) if (e.isIntersecting) setCurrent(e.target.dataset.spy);
    }, { rootMargin: "-18% 0px -72% 0px" });
    book.querySelectorAll(".gentry").forEach((el) => { el.dataset.spy = el.dataset.tag; SPY.observe(el); });
    book.querySelectorAll(".gpart > h2").forEach((el) => { el.dataset.spy = el.parentNode.id.slice(2); SPY.observe(el); });
    const top = book.querySelector("#g-top"); top.dataset.spy = "top"; SPY.observe(top);

    if ($("#gq").value.trim()) search($("#gq").value);
  }

  function setCurrent(id) {
    if (!id || id === GCUR) return;
    GCUR = id;
    const toc = $("#toc");
    toc.querySelectorAll("a.current").forEach((a) => a.classList.remove("current"));
    const a = toc.querySelector(`a[data-go="${id}"]`);
    if (!a) return;
    a.classList.add("current");
    if (a.offsetTop < toc.scrollTop + 20 || a.offsetTop > toc.scrollTop + toc.clientHeight - 40)
      toc.scrollTop = a.offsetTop - toc.clientHeight / 3;
  }

  function goTo(id) {
    const el = document.getElementById("g-" + id);
    if (!el) return;
    if (el.closest("[hidden]")) { $("#gq").value = ""; search(""); }
    el.scrollIntoView({ block: "start" });
    setCurrent(id);
  }

  // Every Greek word in an example links to Logeion, as in the PDF, EPUB and HTML editions.
  const GREEK = /[ΆΈ-Ͽἀ-ᾼῂ-ῌῐ-Ίῠ-Ῥῲ-ῼ][̀-ͯΆΈ-Ͽἀ-ᾼῂ-ῌῐ-Ίῠ-Ῥῲ-ῼ]*/g;
  const textNodes = (root) => {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), out = [];
    while (w.nextNode()) out.push(w.currentNode);
    return out;
  };
  function linkGreek(root) {
    for (const p of root.querySelectorAll(".ex")) {
      for (const n of textNodes(p)) {
        const s = n.nodeValue;
        GREEK.lastIndex = 0;
        if (!GREEK.test(s)) continue;
        GREEK.lastIndex = 0;
        const frag = document.createDocumentFragment();
        let last = 0, m;
        while ((m = GREEK.exec(s))) {
          if (m.index > last) frag.append(s.slice(last, m.index));
          const a = document.createElement("a");
          a.className = "gk"; a.href = "https://logeion.uchicago.edu/" + encodeURIComponent(m[0]);
          a.target = "_blank"; a.rel = "noopener"; a.textContent = m[0];
          frag.append(a);
          last = m.index + m[0].length;
        }
        if (last < s.length) frag.append(s.slice(last));
        n.replaceWith(frag);
      }
    }
  }

  // ---------- search: hide what does not match, highlight what does
  function unmark(root) {
    const parents = new Set();
    for (const m of root.querySelectorAll("mark")) { parents.add(m.parentNode); m.replaceWith(m.textContent); }
    parents.forEach((p) => p.normalize());
  }
  function mark(root, terms) {
    for (const n of textNodes(root)) {
      const s = n.nodeValue, whole = fold(s);
      if (!terms.some((t) => whole.includes(t))) continue;
      let f = "";
      const at = [];
      for (let i = 0; i < s.length;) {
        const ch = String.fromCodePoint(s.codePointAt(i)), fc = fold(ch);
        for (let j = 0; j < fc.length; j++) at.push(i);
        f += fc; i += ch.length;
      }
      at.push(s.length);
      const rs = [];
      for (const t of terms) for (let k = f.indexOf(t); k >= 0; k = f.indexOf(t, k + t.length)) rs.push([at[k], at[k + t.length]]);
      if (!rs.length) continue;
      rs.sort((x, y) => x[0] - y[0]);
      const merged = [];
      for (const r of rs) { const l = merged[merged.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push([...r]); }
      const frag = document.createDocumentFragment();
      let last = 0;
      for (const [a, b] of merged) {
        if (a > last) frag.append(s.slice(last, a));
        const mk = document.createElement("mark"); mk.textContent = s.slice(a, b); frag.append(mk);
        last = b;
      }
      if (last < s.length) frag.append(s.slice(last));
      n.replaceWith(frag);
    }
  }
  function search(q) {
    const book = $("#gbook");
    unmark(book);
    const terms = fold(q).split(/\s+/).filter(Boolean);
    const on = terms.join("").length >= 2;
    const hits = (text) => terms.every((t) => text.includes(t));
    let n = 0, other = false;
    for (const r of GIDX) {
      const hit = !on || hits(r.text);
      r.el.hidden = !hit; if (r.toc) r.toc.hidden = !hit;
      if (hit && on) { n++; mark(r.el, terms); }
    }
    for (const p of GPARTS) {
      const own = on && hits(p.text), shown = !on || own || p.entries.some((r) => !r.el.hidden);
      p.el.hidden = !shown; if (p.toc) p.toc.hidden = !shown;
      if (p.body) p.body.hidden = on && !own;
      if (own) { other = true; mark(p.h2, terms); if (p.body) mark(p.body, terms); }
    }
    if (GINTRO) {
      const own = on && hits(GINTRO.text);
      GINTRO.el.hidden = on && !own; if (GINTRO.toc) GINTRO.toc.hidden = on && !own;
      if (own) { other = true; mark(GINTRO.el, terms); }
    }
    $("#gnone").hidden = !on || n > 0 || other;
    $("#gcount").textContent = on ? `${n} of ${GIDX.length} entries` : "";
  }
  let searchTimer = 0;
  $("#gq").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { search(e.target.value); if (e.target.value.trim()) window.scrollTo(0, 0); }, 180);
  });
  $("#gq").addEventListener("keydown", (e) => {
    if (e.key === "Escape" && e.target.value) { e.target.value = ""; search(""); }
  });
  $("#toc").addEventListener("click", (e) => {
    const a = e.target.closest("a[data-go]");
    if (!a) return;
    e.preventDefault();
    $("#grammar").classList.remove("toc-open"); $("#tocbtn").setAttribute("aria-expanded", "false");
    const h = `#grammar/${GLANG}/${a.dataset.go}`;
    if (location.hash === h) goTo(a.dataset.go); else location.hash = h;
  });
  $("#glangs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-glang]");
    if (b && b.dataset.glang !== GLANG) location.hash = `#grammar/${b.dataset.glang}${GCUR ? "/" + GCUR : ""}`;
  });
  $("#tocbtn").addEventListener("click", () => {
    const open = $("#grammar").classList.toggle("toc-open");
    $("#tocbtn").setAttribute("aria-expanded", String(open));
  });
  function measureBar() { document.documentElement.style.setProperty("--bar-h", $("#gbar").offsetHeight + "px"); }
  window.addEventListener("resize", () => { if (VIEW === "grammar") measureBar(); });

  // ---------- events
  $("#page").addEventListener("click", (e) => {
    const w = e.target.closest(".w");
    if (w) select(+w.dataset.i, false);
  });
  $("#side").addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]"); if (go) return select(+go.dataset.go, true);
    const chip = e.target.closest(".chip"); if (chip) return showEntry(chip.dataset.tag);
    const lang = e.target.closest("[data-lang]");
    if (lang) {
      LANG = lang.dataset.lang; store.set("didakta-lang", LANG);
      document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
      return showEntry(ENTRY_TAG);
    }
    if (e.target.closest("#close")) showEmpty();
  });
  $("#page").addEventListener("keydown", (e) => {
    if (SEL < 0 || !["ArrowRight", "ArrowLeft"].includes(e.key)) return;
    e.preventDefault();
    const step = e.key === "ArrowRight" ? 1 : -1;
    for (let k = SEL + step; k >= 0 && k < BOOK.t.length; k += step) {
      if (!BOOK.t[k][5] && !isPunct(BOOK.t[k])) { select(k, true); break; }
    }
  });
  $("#book").addEventListener("change", (e) => { location.hash = `${WORK.id}-${e.target.value}`; });
  const step = (d) => { const i = WORK.books.findIndex((b) => b.n === BOOK.book) + d; if (WORK.books[i]) location.hash = `${WORK.id}-${WORK.books[i].n}`; };
  $("#prev").addEventListener("click", () => step(-1));
  $("#next").addEventListener("click", () => step(1));
  window.addEventListener("hashchange", route);
  function measureTop() { document.documentElement.style.setProperty("--top-h", $("#top").offsetHeight + "px"); }
  window.addEventListener("resize", measureTop);

  getJSON("data/index.json").then((ix) => { INDEX = ix; route(); }).catch((e) => {
    $("#index").hidden = false;
    $("#index").innerHTML = `<h1>Didakta Reader</h1><p class="lede">The list of texts could not be loaded (${esc(e.message)}). Open this page through a web server, not as a local file.</p>`;
  });
})();
</script>

</body>
</html>
